name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Publish or retry the VERSION checked in on main
        required: true
        type: string

permissions:
  contents: read

# Pull requests supersede their own earlier runs; every push to main runs to
# completion so a release is never cancelled by a later push.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.10"
  NODE_VERSION: "24.22.1"
  PNPM_VERSION: "12.16.1"
  GOLANGCI_LINT_VERSION: v2.15.0
  SQLC_VERSION: v1.31.1

jobs:
  release-rules:
    name: Release rules
    runs-on: ubuntu-26.04
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Test release rules
        run: node --test scripts/release-version.test.mjs
      - name: Check versions and decide the release
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node scripts/release-version.mjs

  # Linux checks build without CGO, like the shipped server; with CGO, Wails
  # would link the GTK desktop stack even under the server tag.
  backend-linux:
    name: Go server (Linux)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Install Go tools
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          go install "github.com/sqlc-dev/sqlc/cmd/sqlc@${SQLC_VERSION}"
      - name: Stub the embedded frontend
        run: mkdir -p frontend/dist && touch frontend/dist/index.html
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Check generated queries
        run: sqlc diff
      - name: Check the exported OpenAPI contract
        run: |
          go run ./cmd/openapi
          git diff --exit-code -- api/openapi.json
      - name: Vet
        run: go vet -tags server ./...
      - name: Lint
        run: golangci-lint run --build-tags server ./...
      - name: Test
        run: go test -tags server ./...

  backend-windows:
    name: Go desktop (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Install golangci-lint
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
      - name: Stub the embedded frontend
        run: mkdir -p frontend/dist && touch frontend/dist/index.html
      - name: Vet
        run: go vet ./...
      - name: Lint
        run: golangci-lint run ./...
      - name: Test with the race detector
        env:
          CGO_ENABLED: "1"
        run: |
          gcc --version
          go test -race ./...
          go test -race -tags server ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check format, lint and types
        run: pnpm check
      - name: Check unused files and exports
        run: pnpm knip
      - name: Check generated API types
        run: |
          pnpm api:types
          git diff --exit-code -- src/api/schema.d.ts
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Build the server for end-to-end tests
        working-directory: .
        env:
          CGO_ENABLED: "0"
        run: go build -tags server,production -trimpath -buildvcs=false -o bin/roomark-server .
      - name: End-to-end tests
        env:
          ROOMARK_E2E_SERVER: ${{ github.workspace }}/bin/roomark-server
        run: pnpm e2e
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Package
    needs: release-rules
    uses: ./.github/workflows/package.yaml
    with:
      release: ${{ needs.release-rules.outputs.release == 'true' }}
    secrets: inherit

  publish:
    name: Publish release
    needs: [release-rules, backend-linux, backend-windows, frontend, package]
    if: needs.release-rules.outputs.release == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    concurrency:
      group: release-${{ needs.release-rules.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.release-rules.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: packages
          merge-multiple: true
      - name: Push the container image
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker load --input packages/image.tar
          rm packages/image.tar
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker tag "$image:v$VERSION" "$image:latest"
          docker push "$image:v$VERSION"
          docker push "$image:latest"
      - name: Write checksums
        working-directory: packages
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Publish the GitHub release
        run: |
          tag="v$VERSION"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            target="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)"
            test "$target" = "$GITHUB_SHA" || { echo "$tag already points to $target" >&2; exit 1; }
            gh release upload "$tag" packages/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            notes="容器镜像：\`$image:$tag\`"$'\n\n'"各平台的安装方式见[部署文档]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$tag/docs/deployment.md)。"
            gh release create "$tag" packages/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Roomark $tag" --notes "$notes" --generate-notes
          fi
