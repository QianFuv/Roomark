name: Package

on:
  workflow_call:
    inputs:
      release:
        description: Build release packages; Android then requires the signing secrets
        required: false
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  GO_VERSION: "1.26.10"
  NODE_VERSION: "24.22.1"
  PNPM_VERSION: "12.16.1"
  WAILS_VERSION: v3.1.0

jobs:
  server:
    name: Server binaries and image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/roomark/frontend/pnpm-lock.yaml
      - name: Build the frontend
        working-directory: apps/roomark/frontend
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Build server binaries
        run: |
          build() {
            CGO_ENABLED=0 GOOS="$1" GOARCH=amd64 go build -tags server,production -trimpath -buildvcs=false -ldflags="-s -w" -o "$2" ./apps/roomark
          }
          build linux out/linux/roomark-server
          build windows out/windows/roomark-server.exe
      - name: Smoke test the Linux server
        run: go run ./apps/roomark/cmd/smoke -binary out/linux/roomark-server
      - name: Archive server binaries
        run: |
          version="$(cat VERSION)"
          mkdir -p packages
          cp LICENSE out/linux/ && cp LICENSE out/windows/
          tar -czf "packages/roomark-server_${version}_linux_amd64.tar.gz" -C out/linux .
          (cd out/windows && zip -q "../../packages/roomark-server_${version}_windows_amd64.zip" ./*)
      - name: Build the container image
        run: |
          version="$(cat VERSION)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:v${version}"
          docker build -f apps/roomark/build/docker/Dockerfile.server -t "$image" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${version}" \
            --label "org.opencontainers.image.title=Roomark" \
            --label "org.opencontainers.image.licenses=MIT" .
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Smoke test the container
        run: |
          docker run -d --name roomark -p 127.0.0.1:18080:8080 --tmpfs /data \
            -e ROOMARK_DB=/data/roomark.db -e ROOMARK_PUBLIC_URL=http://127.0.0.1:18080 \
            -e ROOMARK_ADMIN_NAME=SmokeAdmin -e ROOMARK_ADMIN_PASSCODE=123456 "$IMAGE"
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/health
          curl -fsS http://127.0.0.1:18080/ | grep -q '<div id="root"'
      - name: Show container logs
        if: failure()
        run: docker logs roomark || true
      - name: Save the image for publishing
        if: inputs.release
        run: docker save --output packages/image.tar "$IMAGE"
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-server
          path: packages/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows portable
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/roomark/frontend/pnpm-lock.yaml
      - name: Install Wails
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
      - name: Build the portable zip
        working-directory: apps/roomark
        run: wails3 task package
      - name: Check and rename the archive
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("apps/roomark/bin/Roomark-portable-windows-amd64.zip")
          $entries = $zip.Entries.FullName
          $zip.Dispose()
          $entries
          foreach ($entry in 'Roomark/roomark.exe', 'Roomark/data/') {
            if ($entries -notcontains $entry) { throw "Portable zip is missing $entry" }
          }
          New-Item -ItemType Directory -Force packages | Out-Null
          Move-Item apps/roomark/bin/Roomark-portable-windows-amd64.zip "packages/Roomark_${version}_windows_amd64_portable.zip"
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-windows
          path: packages/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  # Android builds on Windows, the host the Wails Android toolchain is used on
  # locally; Linux would also need the GTK development stack for bindings.
  android:
    name: Android APK
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Decide signing
        id: signing
        env:
          IS_RELEASE: ${{ inputs.release }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
          elif [[ "$IS_RELEASE" == true ]]; then
            echo "mode=omitted" >> "$GITHUB_OUTPUT"
            echo "::warning::Android APK omitted: a release needs all four Android signing secrets."
            echo "### Android APK omitted" >> "$GITHUB_STEP_SUMMARY"
            echo "Set the four ANDROID_* signing secrets to publish an APK; other packages continue." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout source
        if: steps.signing.outputs.mode != 'omitted'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        if: steps.signing.outputs.mode != 'omitted'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Set up pnpm
        if: steps.signing.outputs.mode != 'omitted'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        if: steps.signing.outputs.mode != 'omitted'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/roomark/frontend/pnpm-lock.yaml
      - name: Set up Java 21 and the Android SDK
        if: steps.signing.outputs.mode != 'omitted'
        run: |
          test -d "$JAVA_HOME_21_X64"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          export JAVA_HOME="$JAVA_HOME_21_X64"
          sdkmanager="$(cygpath -u "$ANDROID_HOME")/cmdline-tools/latest/bin/sdkmanager.bat"
          yes | "$sdkmanager" --licenses >/dev/null || test "${PIPESTATUS[1]}" = 0
          "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$(cygpath -m "$ANDROID_HOME")/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install Wails
        if: steps.signing.outputs.mode != 'omitted'
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
      - name: Write the signing keystore
        if: steps.signing.outputs.mode == 'signed'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          keystore="$(cygpath -u "$RUNNER_TEMP")/roomark-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "ANDROID_KEYSTORE_FILE=$(cygpath -m "$keystore")" >> "$GITHUB_ENV"
      - name: Build the APK
        working-directory: apps/roomark
        if: steps.signing.outputs.mode != 'omitted'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: wails3 task android:package
      - name: Verify the signature and rename the APK
        if: steps.signing.outputs.mode != 'omitted'
        env:
          MODE: ${{ steps.signing.outputs.mode }}
        run: |
          version="$(cat VERSION)"
          apksigner="$(cygpath -u "$ANDROID_HOME")/build-tools/36.0.0/apksigner.bat"
          "$apksigner" verify --print-certs apps/roomark/bin/roomark.apk | tee signing.txt
          if [[ "$MODE" == signed ]] && grep -q 'CN=Android Debug' signing.txt; then
            echo "Release APK is signed with the debug key" >&2
            exit 1
          fi
          suffix=""
          [[ "$MODE" == debug ]] && suffix="_debug-signed"
          mkdir -p packages
          mv apps/roomark/bin/roomark.apk "packages/Roomark_${version}_android_arm64${suffix}.apk"
      - name: Remove the signing keystore
        if: always()
        run: rm -f -- "$(cygpath -u "$RUNNER_TEMP")/roomark-release.keystore"
      - name: Upload packages
        if: steps.signing.outputs.mode != 'omitted'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-android
          path: packages/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
